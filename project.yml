name: oh-my-opensnap
options:
  bundleIdPrefix: com.goldenrabbit
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.6"

settings:
  base:
    SWIFT_VERSION: "5.0"            # Swift 5 language mode: AppKit/콜백 코드 안정성 우선
    MARKETING_VERSION: "1.0.91"
    CURRENT_PROJECT_VERSION: "92"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    DEAD_CODE_STRIPPING: YES

targets:
  RegressionTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests
        excludes: ["**/*.py", "**/__pycache__/**"]
      - path: Sources/Library/EditHistory.swift
      - path: Sources/Library/EditorImageView.swift
      - path: Sources/Library/MiddleCutRenderer.swift
      - path: Sources/Library/ZoomableScrollView.swift
      - path: Sources/Library/LibraryFileStore.swift
      - path: Sources/Library/LibraryWriteBuffer.swift
      - path: Sources/Library/CoordinatedFileExporter.swift
      - path: Sources/Library/LibraryCatalog.swift
      - path: Sources/Library/VideoExportService.swift
      - path: Sources/CaptureCore/RecordingSession.swift
      - path: Sources/CaptureCore/DisplayStreamProvider.swift
      - path: Sources/CaptureCore/VideoWriterFinalizer.swift
      - path: Sources/CaptureCore/VideoFrameWriter.swift
      - path: Sources/App/Brand.swift
      - path: Sources/App/L10n.swift
      - path: Sources/Settings/Settings.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goldenrabbit.ohmyopensnap.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

  oh-my-opensnap:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: Sparkle
    info:
      path: Config/Info.plist
      properties:
        LSUIElement: true                              # 메뉴바 상주, Dock 아이콘 숨김
        CFBundleDevelopmentRegion: en                  # 기본 영어. AppKit 시스템 문자열은 시스템 언어(en/ko)를 따른다
        CFBundleLocalizations: [en, ko]
        CFBundleDisplayName: Oh-my-opensnap
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "Copyright © 2026 Golden Rabbit"
        # Sparkle 자동 업데이트
        SUFeedURL: https://raw.githubusercontent.com/Canine89/oh-my-opensnap/main/appcast.xml
        # 2026-09-01 키 교체(구 릴리스 Mac 접근 불가) — 1.0.81 이하 설치본은 이 키와 불일치해
        # 자동 업데이트가 끊기며, 수동 재설치로만 새 트랙에 합류한다.
        SUPublicEDKey: XxOSs5M6eh6sZZU72846xGyexQCnt9X4ylmnEKZNO7s=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400                # 하루 1회 백그라운드 확인
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goldenrabbit.ohmyopensnap
        PRODUCT_NAME: oh-my-opensnap
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: M7NU9F8CZN      # 안정 서명 → 화면녹음 권한 유지 (adhoc 방지)
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"


schemes:
  RegressionTests:
    build:
      targets:
        RegressionTests: all
    test:
      targets:
        - name: RegressionTests
          parallelizable: false
